.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  height: 100%;

  width: 14px;
  height: 14px;

}

  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  cursor: not-allowed;

.form-check-label {

  height: 20px;

  left: 0;

  height: 16px;

.form-range::-moz-range-track {

  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {

.text-destructive {
  color: var(--destructive);
}

a-lucide=&quot;bell&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;dd-unread&quot; class=&quot;count&quot; hidden&gt;0&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;main class=&quot;content&quot; id=&quot;dd-content&quot;&gt;&lt;/main&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;

let safetyTimer=null,toastTimer=null,restoreFocus=null,safetyProgress=0,safetyPlaying=false;

function icon(name){return &#x27;&lt;i data-lucide=&quot;&#x27;+name+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;}
function escape(value){return String(value??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,character=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[character]));}
function formatDate(value){const date=new Date(value);return (date.getMonth()+1)+&#x27;月&#x27;+date.getDate()+&#x27;日 &#x27;+String(date.getHours()).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(date.getMinutes()).padStart(2,&#x27;0&#x27;);}
function nowLabel(){return new Date().toLocaleTimeString(&#x27;zh-CN&#x27;,{hour:&#x27;2-digit&#x27;,minute:&#x27;2-digit&#x27;});}
function currentCar(){return cars.find(car=&gt;car.id===state.application.vehicle);}
function notify(recipients,title,message,type=&#x27;info&#x27;){state.notifications.unshift({id:Date.now()+Math.random(),recipients:[...recipients],title,message,type,time:nowLabel(),readBy:[]});updateBadge();}
function updateBadge(){const count=state.notifications.filter(item=&gt;item.recipients.includes(state.role)&amp;&amp;!item.readBy.includes(state.role)).length;const badge=root.querySelector(&#x27;#dd-unread&#x27;);badge.textContent=count;badge.hidden=count===0;root.querySelector(&#x27;#dd-notices&#x27;).setAttribute(&#x27;aria-label&#x27;,&#x27;消息通知，&#x27;+count+&#x27;条未读&#x27;);}

function toast(message){const element=root.querySelector(&#x27;#dd-toast&#x27;);element.textContent=message;element.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=&gt;element.hidden=true,3200);}
function addHistory(title,detail){state.application.history.push({title,detail:detail||roles[state.role]+&#x27; · &#x27;+nowLabel()});}
function monitorEnergy(car){for(const field of [&#x27;battery&#x27;,&#x27;fuel&#x27;]){if(car[field]===null)continue;const key=car.id+&#x27;-&#x27;+field;if(car[field]&lt;10&amp;&amp;!lowStates.has(key)){lowStates.add(key);notify([&#x27;store&#x27;],&#x27;车辆低能量预警&#x27;,car.name+&#x27;（&#x27;+car.plate+&#x27;）&#x27;+(field===&#x27;battery&#x27;?&#x27;电量&#x27;:&#x27;油量&#x27;)+&#x27; &#x27;+car[field]+&#x27;%，已低于10%。请安排补能。&#x27;,&#x27;alert&#x27;);}else if(car[field]&gt;=10){lowStates.delete(key);}}}
function statusInfo(application){return ({store:[&#x27;待店长审批&#x27;,&#x27;warn&#x27;],upper:[&#x27;待&#x27;+(application.approver===&#x27;city&#x27;?&#x27;城市经理&#x27;:&#x27;省总&#x27;)+&#x27;审批&#x27;,&#x27;warn&#x27;],ready:[application.safe?&#x27;待出发&#x27;:&#x27;待安全学习&#x27;,&#x27;&#x27;],active:[&#x27;试驾进行中&#x27;,&#x27;&#x27;],completed:[&#x27;试驾已完成&#x27;,&#x27;&#x27;],rejected:[&#x27;申请已驳回&#x27;,&#x27;red&#x27;]})[application.status];}
function energyMeter(label,value){return &#x27;&lt;div class=&quot;energy&quot;&gt;&lt;div class=&quot;energy-label&quot;&gt;&lt;span&gt;&#x27;+label+&#x27;&lt;/span&gt;&lt;strong style=&quot;color:&#x27;+(value&lt;10?&#x27;var(--red)&#x27;:&#x27;var(--ink)&#x27;)+&#x27;&quot;&gt;&#x27;+value+&#x27;%&#x27;+(value&lt;10?&#x27; · 低能量&#x27;:&#x27;&#x27;)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;meter&quot; role=&quot;meter&quot; aria-label=&quot;&#x27;+label+&#x27;&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;&#x27;+value+&#x27;&quot;&gt;&lt;div class=&quot;meter-fill &#x27;+(value&lt;10?&#x27;low&#x27;:&#x27;&#x27;)+&#x27;&quot; style=&quot;width:&#x27;+value+&#x27;%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;}
function heading(title,description,action=&#x27;&#x27;){return &#x27;&lt;div class=&quot;heading&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+title+&#x27;&lt;/h1&gt;&lt;p class=&quot;subtitle&quot;&gt;&#x27;+description+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+action+&#x27;&lt;/div&gt;&#x27;;}
function footer(){return &#x27;&lt;div class=&quot;footer&quot;&gt;&lt;span&gt;Demo · 路线、车况、轨迹、推送均为本地模拟&lt;/span&gt;&lt;span&gt;申请 → 审批 → 出发 → 回顾&lt;/span&gt;&lt;/div&gt;&#x27;;}
function routeDiagram(route,progress=-1){return &#x27;&lt;div class=&quot;route-box&quot;&gt;&lt;div class=&quot;route-header&quot;&gt;&lt;div&gt;&lt;strong&gt;&#x27;+route.name+&#x27;&lt;/strong&gt;&lt;div class=&quot;caption&quot;&gt;路线流程示意 · 非真实地图&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill&quot;&gt;系统推荐&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;route-path&quot;&gt;&#x27;+route.nodes.map((node,index)=&gt;&#x27;&lt;div class=&quot;route-node &#x27;+(progress===index?&#x27;live&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span class=&quot;point&quot;&gt;&#x27;+(index+1)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+escape(index===1?state.application.location:node)+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;route-metrics&quot;&gt;&lt;span&gt;&lt;strong&gt;&#x27;+route.distance+&#x27; km&lt;/strong&gt;计划里程&lt;/span&gt;&lt;span&gt;&lt;strong&gt;&#x27;+route.minutes+&#x27; 分钟&lt;/strong&gt;预计全程&lt;/span&gt;&lt;span&gt;&lt;strong&gt;&#x27;+route.need+&#x27;%&lt;/strong&gt;估算耗电&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;}
function approvalPanel(){const application=state.application;const passed=[&#x27;ready&#x27;,&#x27;active&#x27;,&#x27;completed&#x27;].includes(application.status);const steps=[[&#x27;提交申请&#x27;,&#x27;产品专家 · 林悦&#x27;,true,false],[&#x27;店长审批&#x27;,&#x27;店长 · 陈航&#x27;,application.history.some(item=&gt;item.title===&#x27;店长审批通过&#x27;),application.status===&#x27;store&#x27;],[(application.approver===&#x27;city&#x27;?&#x27;城市经理&#x27;:&#x27;省总&#x27;)+&#x27;审批&#x27;,roles[application.approver],passed,application.status===&#x27;upper&#x27;],[&#x27;路线生成与安全学习&#x27;,application.route?(application.safe?&#x27;路线已生成 · 学习已完成&#x27;:&#x27;路线已生成 · 待学习&#x27;):&#x27;全部审批通过后自动触发&#x27;,application.safe,application.status===&#x27;ready&#x27;&amp;&amp;!application.safe]];return &#x27;&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;审批进度&lt;/h2&gt;&lt;span class=&quot;caption&quot;&gt;串行审批&lt;/span&gt;&lt;/div&gt;&#x27;+steps.map((step,index)=&gt;&#x27;&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-dot &#x27;+(step[2]?&#x27;done&#x27;:step[3]?&#x27;current&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+(step[2]?&#x27;✓&#x27;:index+1)+&#x27;&lt;/div&gt;&lt;div class=&quot;step-line&quot;&gt;&lt;strong&gt;&#x27;+step[0]+&#x27;&lt;/strong&gt;&lt;p&gt;&#x27;+step[1]+(step[3]?&#x27; · 待处理&#x27;:&#x27;&#x27;)+&#x27;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+(application.status===&#x27;rejected&#x27;?&#x27;&lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;note error&quot;&gt;&#x27;+escape(application.rejectReason)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/section&gt;&#x27;;}
function taskActions(){const application=state.application;const status=application.status;if(status===&#x27;store&#x27;||status===&#x27;upper&#x27;){const owner=status===&#x27;store&#x27;?&#x27;store&#x27;:application.approver;return state.role===owner?&#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-action=&quot;approve&quot;&gt;&#x27;+icon(&#x27;check&#x27;)+&#x27;同意申请&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;button danger&quot; data-action=&quot;reject&quot;&gt;驳回&lt;/button&gt;&#x27;:&#x27;&lt;button type=&quot;button&quot; class=&quot;button&quot; data-action=&quot;switch&quot; data-role=&quot;&#x27;+owner+&#x27;&quot;&gt;&#x27;+icon(&#x27;user-round-cog&#x27;)+&#x27;切换&#x27;+(status===&#x27;store&#x27;?&#x27;店长&#x27;:application.approver===&#x27;city&#x27;?&#x27;城市经理&#x27;:&#x27;省总&#x27;)+&#x27;审批&lt;/button&gt;&#x27;;}
if(status===&#x27;ready&#x27;){if(state.role!==&#x27;expert&#x27;)return &#x27;&lt;button type=&quot;button&quot; class=&quot;button&quot; data-action=&quot;switch&quot; data-role=&quot;expert&quot;&gt;切换专家继续&lt;/button&gt;&#x27;;return application.safe?&#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-action=&quot;start&quot;&gt;开始上门试驾&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;button&quot; data-action=&quot;safety&quot;&gt;重看安全提醒&lt;/button&gt;&#x27;:&#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-action=&quot;safety&quot;&gt;观看安全提醒&lt;/button&gt;&#x27;;}
if(status===&#x27;active&#x27;)return state.role===&#x27;expert&#x27;?&#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-action=&quot;finish&quot;&gt;完成试驾并生成回顾&lt;/button&gt;&#x27;:&#x27;&lt;button type=&quot;button&quot; class=&quot;button&quot; data-action=&quot;switch&quot; data-role=&quot;expert&quot;&gt;切换专家完成试驾&lt;/button&gt;&#x27;;
if(status===&#x27;completed&#x27;)return &#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-action=&quot;view-report&quot;&gt;查看本次回顾&lt;/button&gt;&#x27;;

function dashboard(){const application=state.application;const car=currentCar();const [statusLabel,statusClass]=statusInfo(application);const lowCars=cars.filter(item=&gt;item.battery&lt;10||(item.fuel!==null&amp;&amp;item.fuel&lt;10));const route=application.route;return heading(&#x27;让每一次上门试驾，更有序&#x27;,&#x27;从客户预约到试驾回顾，全流程协同。&#x27;,&#x27;&lt;button type=&quot;button&quot; class=&quot;button primary&quot; data-page=&quot;application&quot;&gt;&#x27;+icon(&#x27;plus&#x27;)+&#x27;新建申请&lt;/button&gt;&#x27;)+&#x27;&lt;div class=&quot;stats&quot;&gt;&#x27;+[[&#x27;待审批申请&#x27;,[&#x27;store&#x27;,&#x27;upper&#x27;].includes(application.status)?1:0,&#x27;店长 → 城市经理 / 省总&#x27;,&#x27;clipboard-clock&#x27;],[&#x27;进行中试驾&#x27;,application.status===&#x27;active&#x27;?1:0,&#x27;实时跟踪路线与车况&#x27;,&#x27;route&#x27;],[&#x27;低能量车辆&#x27;,lowCars.length,&#x27;低于10%自动提醒店长&#x27;,&#x27;battery-warning&#x27;]].map((item,index)=&gt;&#x27;&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;stat-top&quot;&gt;&lt;span&gt;&#x27;+item[0]+&#x27;&lt;/span&gt;&#x27;+icon(item[3])+&#x27;&lt;/div&gt;&lt;div class=&quot;stat-value&quot; &#x27;+(index===2?&#x27;style=&quot;color:var(--warn)&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+item[1]+&#x27;&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;&#x27;+item[2]+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;stack&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;当前试驾任务&lt;/h2&gt;&lt;span class=&quot;pill &#x27;+statusClass+&#x27;&quot;&gt;&#x27;+statusLabel+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;task-title&quot;&gt;&lt;strong&gt;&#x27;+escape(application.customer)+&#x27; · 上门试驾&lt;/strong&gt;&lt;span class=&quot;caption&quot;&gt;&#x27;+application.id+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;dl class=&quot;details&quot;&gt;&lt;div&gt;&lt;dt&gt;预约出发&lt;/dt&gt;&lt;dd&gt;&#x27;+formatDate(application.start)+&#x27;&lt;/dd&gt;&       selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
